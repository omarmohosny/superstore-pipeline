version: 2

models:
  - name: mart_monthly_sales
    columns:
      - name: month_start
        data_tests: [unique, not_null]
  - name: mart_customer_rfm
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: rfm_segment
        data_tests:
          - accepted_values:
              values: ['Champion', 'Loyal', 'At risk', 'Lost', 'Regular']
  - name: mart_category_region_profit
    columns:
      - name: category
        data_tests: [not_null]
  - name: mart_shipping_performance
    columns:
      - name: ship_mode
        data_tests: [not_null]
