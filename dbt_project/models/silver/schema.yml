version: 2

models:
  - name: silver_superstore
    columns:
      - name: row_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: sales
        data_tests: [not_null]
      - name: ship_mode
        data_tests:
          - accepted_values:
              values: ['Same Day', 'First Class', 'Second Class', 'Standard Class']

  - name: silver_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: silver_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
