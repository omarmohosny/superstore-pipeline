version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_key
        data_tests: [unique, not_null]
  - name: dim_location
    columns:
      - name: location_key
        data_tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: fact_sales
    columns:
      - name: row_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: location_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_key
      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: ship_date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
